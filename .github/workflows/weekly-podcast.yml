name: Weekly Podcast

on:
  workflow_dispatch:  # Triggered by cron-job.org every Monday 6:00 AM UTC

permissions:
  contents: write

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # edge-tts synthesis needs ~15-20 min for a 15-20 min episode

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ffmpeg is pre-installed on GitHub Actions ubuntu-latest — no install needed

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests edge-tts mutagen

      - name: Generate podcast
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          CRON_SECRET:   ${{ secrets.CRON_SECRET }}
        run: python scripts/generate_podcast.py

      - name: Commit and push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- data/
          git diff --staged --quiet \
            && echo "No changes — skipping commit" \
            || git commit -m "chore: weekly podcast ep $(date -u +'%Y-%m-%d')"
          git restore -- . 2>/dev/null || true
          git pull --rebase origin main
          git push

      # Read-only: records what this run produced so the steps below can check
      # that exact episode reached production.
      - name: Identify generated episode
        id: episode
        run: |
          EP=$(python -c "import json; d=json.load(open('data/podcast_meta.json')); print(d['episode'])")
          FILE=$(python -c "import json; d=json.load(open('data/podcast_meta.json')); print(d['file'])")
          echo "number=$EP"   >> "$GITHUB_OUTPUT"
          echo "file=$FILE"   >> "$GITHUB_OUTPUT"
          echo "Generated episode $EP ($FILE)"

      # The Vercel project has NO Git integration — Deploy Hooks reports "not
      # connected to a Git repository" — so pushing to GitHub deploys nothing.
      # This workflow previously assumed the push was enough and published no
      # deployment of its own, so a Monday-morning episode only went live when
      # the evening daily-intelligence run happened to deploy, ~14 hours later.
      # Mirrors the deploy step in daily-intelligence.yml, including its
      # behaviour when the token is absent.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID:     team_cBG29NHHnnkVTbkmZOjZ7RCy
          VERCEL_PROJECT_ID: prj_dpklrWAGa5FSVf6yOltJM3aJgtn9
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deployment"
            exit 0
          fi
          npm install -g vercel@latest --quiet
          vercel --prod --yes --token "$VERCEL_TOKEN"
          echo "✓ Deployed to Vercel"

      # A green run that publishes nothing is the failure mode that hid this for
      # weeks. Confirm the episode is actually being served, and fail loudly if
      # it is not, rather than reporting success.
      - name: Verify the episode is live
        env:
          EP:   ${{ steps.episode.outputs.number }}
          FILE: ${{ steps.episode.outputs.file }}
        run: |
          BASE="https://portfolio-pulse-dun.vercel.app"
          for attempt in $(seq 1 10); do
            LIVE=$(curl -fsS --max-time 20 "$BASE/data/podcast_meta.json?cb=$(date +%s)" \
                   | python -c "import json,sys; print(json.load(sys.stdin).get('episode',''))" 2>/dev/null || echo "")
            CODE=$(curl -o /dev/null -s -w '%{http_code}' --max-time 30 "$BASE/data/$FILE")

            if [ "$LIVE" = "$EP" ] && [ "$CODE" = "200" ]; then
              echo "✓ Episode $EP is live and $FILE is being served"
              exit 0
            fi
            echo "  attempt $attempt/10 — live episode='$LIVE' (want '$EP'), $FILE returned $CODE"
            sleep 20
          done

          echo "::error::Episode $EP was generated and pushed but is not being served at $BASE."
          echo "The audio file is $FILE. Check the Vercel deployment for this run."
          exit 1
