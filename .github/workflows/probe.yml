name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" -d '{"action":"probe"}' \
            --max-time 120 https://portfolio-pulse-dun.vercel.app/api/dividends
