name: Voice Test

# One-off: synthesises the same passage in several free voices so they can be compared.
on:
  workflow_dispatch:

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install kokoro-onnx soundfile lameenc piper-tts numpy
      - name: Synthesise samples
        run: python scripts/voice_test/make_samples.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/*.mp3
